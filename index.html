<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#170B10" />
    <!-- Pre-paint theme: OS preference on first visit (user asked for
         system-default), persisted toggle choice afterwards. Runs before
         first paint so there is never a flash of the wrong ground. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("omkar_theme");
          var mode =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", mode);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", mode === "light" ? "#FAF7F2" : "#170B10");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Omkar Samithi — bilingual (English/Kannada) community platform for the Oman Karnataka Aradhana Samithi, Muscat. Programs, events, recordings and festival notes."
    />

    <!-- Social preview — absolute URLs required by scrapers -->
    <link rel="canonical" href="https://omkar-app.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://omkar-app.vercel.app/" />
    <meta property="og:site_name" content="Omkar Samithi" />
    <meta property="og:title" content="Omkar Samithi · Oman Karnataka Aradhana Samithi, Muscat" />
    <meta
      property="og:description"
      content="Programs, upcoming events, festival calendar, recordings and seva opportunities — bilingual English & Kannada."
    />
    <meta property="og:image" content="https://omkar-app.vercel.app/og-banner.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Omkar Samithi emblem beside gold lettering — Omkar Samithi, Oman Karnataka Aradhana Samithi, Muscat, Oman — above a row of lit oil lamps."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Omkar Samithi · Muscat" />
    <meta
      name="twitter:description"
      content="Programs, events, festival calendar and recordings — bilingual English & Kannada."
    />
    <meta name="twitter:image" content="https://omkar-app.vercel.app/og-banner.jpg" />
    <meta
      name="twitter:image:alt"
      content="Omkar Samithi emblem beside gold lettering — Omkar Samithi, Oman Karnataka Aradhana Samithi, Muscat, Oman — above a row of lit oil lamps."
    />

    <link rel="icon" type="image/png" href="/omkar-logo.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Fonts: preconnected + render-blocking link (was a late @import inside CSS) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Karla:wght@400;500;700&family=Noto+Sans+Kannada:wght@400;600&display=swap"
    />

    <!-- The mark is the largest element on the first screen and it is rendered
         by the bundle, so without this hint the browser cannot start fetching
         it until React has run. The candidate list mirrors the <picture> in
         src/App.jsx exactly (a guard test keeps the two in step); browsers that
         do not understand imagesrcset simply do not preload, and nothing is
         ever fetched twice. -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      imagesrcset="/omkar-logo-220.webp 220w, /omkar-logo-512.webp 512w"
      imagesizes="220px"
    />

    <!-- Structured data: what a search engine needs to present the Samithi as
         an organisation rather than a page. Every value here is already stated
         on the site — no invented address, no invented profiles. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Omkar Samithi",
        "alternateName": ["Oman Karnataka Aradhana Samithi", "ಓಂಕಾರ ಸಮಿತಿ"],
        "url": "https://omkar-app.vercel.app/",
        "logo": "https://omkar-app.vercel.app/icon-512.png",
        "description": "Karnataka cultural and devotional organisation in Muscat, Oman — programs, poojas, music and community.",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Muscat",
          "addressCountry": "OM"
        },
        "areaServed": "Muscat, Oman",
        "knowsLanguage": ["en", "kn"],
        "sameAs": [
          "https://www.youtube.com/@OmkarSamithi",
          "https://omkarsamithi.blogspot.com/",
          "https://omkarfeedback.blogspot.com/"
        ]
      }
    </script>

    <title>Omkar Samithi · Oman Karnataka Aradhana Samithi, Muscat</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
